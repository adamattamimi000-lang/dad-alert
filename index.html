<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dad Alert</title>

<style>
body {
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 15px;
}

h1 {
  margin-top: 50px;
  font-size: 35px;
}

p {
  color: #cccccc;
}

button {
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: #ff3030;
  color: white;
  border: 8px solid #ff7777;
  font-size: 45px;
  font-weight: bold;
  margin-top: 70px;
  cursor: pointer;
}

button:active {
  background: #aa0000;
}

#status {
  margin-top: 35px;
  font-size: 19px;
}
</style>
</head>

<body>

<h1>❤️ Dad Alert</h1>

<p>Tekan butang jika perlukan bantuan</p>

<button onclick="sendSOS()">SOS</button>

<div id="status">🟢 Sedia digunakan</div>

<script>
function sendSOS() {
  document.getElementById("status").innerText =
    "⚠️ Mod percubaan: alert belum dihantar.";
}
</script>

</body>
</html>
