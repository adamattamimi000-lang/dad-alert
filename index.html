<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#101820">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="apple-mobile-web-app-title"
content="Dad Alert">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Abah alert ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px;
}

h1 {
  margin-top: 35px;
}

input {
  display: block;
  width: 100%;
  max-width: 350px;
  padding: 16px;
  margin: 15px auto;
  border-radius: 12px;
  border: none;
  font-size: 17px;
}

button {
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.login {
  background: #1683ff;
  color: white;
  padding: 17px 45px;
  border-radius: 12px;
  font-size: 18px;
}

.sos {
  width: 240px;
  height: 240px;
  background: #ff3030;
  border-radius: 50%;
  color: white;
  font-size: 45px;
  margin-top: 45px;
  border: 8px solid #ff8585;
}

.ack {
  background: #21aa60;
  color: white;
  padding: 20px;
  border-radius: 15px;
  font-size: 20px;
}

.logout {
  background: #444;
  color: white;
  padding: 12px;
  border-radius: 10px;
  margin-top: 50px;
}

#app {
  display: none;
}

#status {
  font-size: 19px;
  margin-top: 30px;
}

#warning {
  display: none;
  background: #b50000;
  padding: 25px;
  border-radius: 15px;
  margin-top: 25px;
}
</style>
</head>

<body>

<h1>❤️ Abah Alert</h1>

<div id="loginPage">
  <h2>Log Masuk</h2>

  <input id="email"
  type="email"
  placeholder="Email">

  <input id="password"
  type="password"
  placeholder="Password">

  <button class="login" id="loginBtn">
    LOGIN
  </button>

  <p id="loginStatus"></p>
</div>

<div id="app">

  <h2 id="welcome"></h2>

  <div id="dadPage" style="display:none">
    <p>Tekan Panggil adam jika perlukan bantuan</p>

    <button class="sos" id="sosBtn">
      Panggil Adam
    </button>
  </div>

  <div id="childPage" style="display:none">
    <h2>Telefon Anak 📱</h2>

    <button id="notifyBtn" style="
background:#1683ff;
color:white;
padding:18px;
border-radius:12px;
font-size:18px;
margin:15px;
">
🔔 AKTIFKAN NOTIFIKASI
</button>

<p id="notifyStatus"></p>

    <button id="enableSound" style="
background:#0088ff;
color:white;
padding:18px;
border-radius:12px;
font-size:18px;
margin:15px;
">
🔊 AKTIFKAN BUNYI
</button>

    <div id="warning">
      <h1>🚨 ABAH PERLUKAN BANTUAN!</h1>

      <button class="ack" id="ackBtn">
        SAYA DAH TERIMA
      </button>
    </div>

    <p id="normal">Tiada SOS aktif</p>
  </div>

  <p id="status">Sedang menyambung...</p>

  <button class="logout" id="logoutBtn">
    Log Keluar
  </button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
}
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

import {
 getDatabase,
 ref,
 set,
 onValue
}
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";


// MASUKKAN FIREBASE CONFIG KAU

const firebaseConfig = {
  apiKey: "AIzaSyBSlq4jaXIpOjLm84p4zIctvVQabg6Rayc",
  authDomain: "dadalert.firebaseapp.com",
  databaseURL: "https://dadalert-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dadalert",
  storageBucket: "dadalert.firebasestorage.app",
  messagingSenderId: "103138330569",
  appId: "1:103138330569:web:bd654307d854fab3964a18"
};


// MASUKKAN UID SEBENAR

const DAD_UID = "J3tuJfEIVLVFY38EdKdGYCCaat63";

const CHILD_UID = "0WhUl88uI3cT1tcEhP5YwXidUmf1";


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let sosTime = 0;
let ackTime = 0;
let unsubscribe = [];

const el = id => document.getElementById(id);

  let audioCtx = null;
let alarmInterval = null;
let soundEnabled = false;
let lastActive = false;
let alertInitialized = false;

function beep() {
  if (!audioCtx || audioCtx.state !== "running") return;

  const oscillator = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  oscillator.type = "square";
  oscillator.frequency.value = 880;

  oscillator.connect(gain);
  gain.connect(audioCtx.destination);

  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + 0.4
  );

  oscillator.start();
  oscillator.stop(audioCtx.currentTime + 0.4);
}

function startAlarm() {
  if (!soundEnabled || alarmInterval) return;

  beep();
  alarmInterval = setInterval(beep, 900);
}

function stopAlarm() {
  if (alarmInterval) {
    clearInterval(alarmInterval);
    alarmInterval = null;
  }
}

el("enableSound").onclick = async () => {
  try {
    audioCtx ??= new (window.AudioContext ||
      window.webkitAudioContext)();

    await audioCtx.resume();

    soundEnabled = audioCtx.state === "running";

    el("enableSound").innerText = soundEnabled
      ? "✅ BUNYI DIAKTIFKAN"
      : "❌ GAGAL AKTIFKAN BUNYI";

    if (soundEnabled) {
      beep();
      if (sosTime > ackTime) startAlarm();
    }
  } catch (e) {
    el("enableSound").innerText =
      "❌ GAGAL AKTIFKAN BUNYI";
  }
};

function displayAlert() {
  const active = sosTime > ackTime;

  el("warning").style.display =
    active ? "block" : "none";

  el("normal").style.display =
    active ? "none" : "block";

  const isChild =
    auth.currentUser?.uid === CHILD_UID;

  if (isChild) {
    if (active && soundEnabled) {
      startAlarm();
    } else {
      stopAlarm();
    }
  }
}

el("loginBtn").onclick = async () => {
  el("loginStatus").innerText = "Sedang login...";

  try {
    await signInWithEmailAndPassword(
      auth,
      el("email").value.trim(),
      el("password").value
    );
  } catch (e) {
  el("loginStatus").innerText =
    "ERROR: " + e.code + " - " + e.message;
}
};

onAuthStateChanged(auth, user => {

  unsubscribe.forEach(fn => fn());
  unsubscribe = [];

  if (!user) {
    el("loginPage").style.display = "block";
    el("app").style.display = "none";
    return;
  }

  if (
    user.uid !== DAD_UID &&
    user.uid !== CHILD_UID
  ) {
    el("loginStatus").innerText =
      "Akaun tidak dibenarkan.";
    signOut(auth);
    return;
  }

  el("loginPage").style.display = "none";
  el("app").style.display = "block";

  const isDad = user.uid === DAD_UID;

  el("dadPage").style.display =
    isDad ? "block" : "none";

  el("childPage").style.display =
    isDad ? "none" : "block";

  el("welcome").innerText =
    isDad ? "Hai Ayah ❤️" : "Hai Anak ❤️";

  const unsubSOS = onValue(
    ref(db, "sos"),
    snapshot => {
      sosTime = snapshot.val() || 0;
      displayAlert();

      if (isDad && sosTime > ackTime) {
        el("status").innerText =
          "🚨 SOS direkodkan. Menunggu pengesahan anak.";
      }
    },
    () => {
      el("status").innerText =
        "⚠️ Gagal membaca SOS. Semak sambungan.";
    }
  );

  const unsubAck = onValue(
    ref(db, "ack"),
    snapshot => {
      ackTime = snapshot.val() || 0;
      displayAlert();

      if (isDad && sosTime <= ackTime) {
        el("status").innerText =
          "✅ Tiada SOS yang menunggu pengesahan.";
      }
    },
    () => {
      el("status").innerText =
        "⚠️ Gagal membaca pengesahan.";
    }
  );

  unsubscribe = [unsubSOS, unsubAck];
});

el("sosBtn").onclick = async () => {
  el("status").innerText = "Menghantar SOS...";

  el("sosBtn").disabled = true;

  try {
    await set(ref(db, "sos"), Date.now());

    el("status").innerText =
      "✅ SOS direkodkan. Belum disahkan oleh anak.";

  } catch (e) {
    el("status").innerText =
      "❌ Tidak berjaya. Sila telefon anak.";
  } finally {
    el("sosBtn").disabled = false;
  }
};

el("ackBtn").onclick = async () => {
  try {
    await set(ref(db, "ack"), Date.now());
    el("status").innerText =
      "✅ Pengesahan telah direkodkan.";
  } catch (e) {
    el("status").innerText =
      "❌ Gagal mengesahkan SOS.";
  }
};

el("logoutBtn").onclick = () => signOut(auth);

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const registration =
        await navigator.serviceWorker.register("./sw.js");

      console.log(
        "Dad Alert Service Worker ready",
        registration.scope
      );
    } catch (error) {
      console.error(
        "Service Worker failed:",
        error
      );
    }
  });
}
</script>

<script>
document.getElementById("notifyBtn")
.addEventListener("click", async () => {

  const status =
    document.getElementById("notifyStatus");

  if (!("Notification" in window) ||
      !("serviceWorker" in navigator)) {
    status.innerText =
      "❌ Telefon atau browser tidak menyokong fungsi ini.";
    return;
  }

  try {
    const permission =
      await Notification.requestPermission();

    if (permission === "granted") {

      const registration =
        await navigator.serviceWorker.ready;

      await registration.showNotification(
        "❤️ Dad Alert",
        {
          body: "Notifikasi ujian berjaya!",
          tag: "dad-alert-test"
        }
      );

      status.innerText =
        "✅ Notifikasi dibenarkan!";

    } else {
      status.innerText =
        "❌ Kebenaran notifikasi tidak diberikan.";
    }

  } catch (error) {
    status.innerText =
      "❌ Gagal mengaktifkan notifikasi: " +
      error.message;
  }

});
</script>
  
</body>
</html>
